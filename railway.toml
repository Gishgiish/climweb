[build]
builder = "nixpacks"

[build.nixpacks]
# Use Python 3.10
python_version = "3.10"

# Install only runtime deps
apt_pkgs = ["cron", "tini", "gosu", "libpq5", "libgeos-c1v5", "libmagic1", "libcairo2", "libpango-1.0-0", "libffi8", "poppler-utils"]

pip_packages = ["django-environ"]

[phases.build]
cmds = [
  "pip list | grep -i environ",  # Debug: Check if django-environ is installed
  "pip install -r climweb/requirements/base.txt",
  "pip list | grep -i environ",  # Debug: Check again after install
  "cd climweb/src && python climweb/manage.py collectstatic --noinput 2>/dev/null || true"
]

[deploy]
startCommand = "cd /app/climweb/src && gunicorn climweb.config.wsgi:application --bind 0.0.0.0:$PORT"
healthcheckPath = "/api/_health/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"