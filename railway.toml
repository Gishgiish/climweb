[build]
builder = "DOCKERFILE"

[deploy]
healthcheckPath = "/api/_health/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
preDeploy = "cd /app/climweb/src/climweb && python manage.py migrate --noinput --settings=climweb.config.settings.prod && python manage.py collectstatic --noinput --settings=climweb.config.settings.prod"
startCommand = "cd /app/climweb/src/climweb && gunicorn climweb.config.wsgi:application --bind 0.0.0.0:$PORT --log-file -"